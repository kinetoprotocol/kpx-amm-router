[profile.default]
src          = "src"
test         = "test"
out          = "out"
libs         = ["lib"]
solc         = "0.8.24"
optimizer    = true
optimizer_runs = 200
ffi          = false
via_ir       = true
remappings   = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Fuzz settings
[profile.default.fuzz]
runs         = 10000
max_test_rejects = 65536
seed         = "0x42"

# Invariant settings
[profile.default.invariant]
runs         = 256
depth        = 15
fail_on_revert = false

# CI profile
[profile.ci]
fuzz         = { runs = 1000 }
verbosity    = 3
