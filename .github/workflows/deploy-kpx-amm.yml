# .github/workflows/deploy-kpx-amm.yml
# AXIOLEDGER — KPXRouterGateway CI/CD Pipeline
#
# Triggers:
#   - pull_request to main: forge test + slither audit
#   - push to main:         forge test + deploy to Sepolia
#   - workflow_dispatch:    manual with network selection
#
# Required GitHub Actions Secrets:
#   SEPOLIA_RPC_URL      — Alchemy/Infura Sepolia RPC
#   DEPLOYER_PRIVATE_KEY — Deployer EOA key
#   ETHERSCAN_API_KEY    — Contract verification

name: KPX AMM Router CI/CD

on:
  push:
    branches: [main]
    paths:
      - '**.sol'
      - 'script/**'
      - 'foundry.toml'
  pull_request:
    branches: [main]
    paths:
      - '**.sol'
      - 'script/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target network"
        required: true
        default: "sepolia"
        type: choice
        options: [sepolia, mainnet]
      dry_run:
        description: "Dry run (no broadcast)"
        required: false
        default: "true"
        type: boolean

concurrency:
  group: kpx-amm-${{ github.ref }}
  cancel-in-progress: false

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ─── Job 1: Security gate ─────────────────────────────────────────────────
  security-scan:
    name: "Security Gate (TruffleHog)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ─── Job 2: Forge test ────────────────────────────────────────────────────
  forge-test:
    name: "Forge Test"
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "🔧 Install Foundry"
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: "📦 Install dependencies"
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: "🔨 Build & check sizes"
        run: forge build --sizes

      - name: "🧪 Forge test (fork Sepolia)"
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

  # ─── Job 3: Slither audit (non-blocking) ──────────────────────────────────
  slither-audit:
    name: "Slither Static Analysis"
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 15
    permissions:
      contents: read
    continue-on-error: true   # Non-blocking: audit results uploaded, not gate

    steps:
      - uses: actions/checkout@v4
      - name: "🔍 Slither"
        uses: crytic/slither-action@v0.4.0
        with:
          target: "."
          slither-args: "--exclude-dependencies --filter-paths lib/"
          fail-on: high
        continue-on-error: true

      - name: "📤 Upload Slither report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report-${{ github.sha }}
          path: slither-output/
          retention-days: 30

  # ─── Job 4: Deploy (push to main or manual) ──────────────────────────────
  deploy:
    name: "Deploy → ${{ github.event.inputs.environment || 'sepolia' }}"
    runs-on: ubuntu-latest
    needs: [forge-test]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    timeout-minutes: 20
    permissions:
      contents: read
    environment: ${{ github.event.inputs.environment || 'sepolia' }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "🔧 Install Foundry"
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: "📦 Install dependencies"
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: "🚀 Deploy KPXRouterGateway"
        id: deploy
        run: |
          forge script script/DeployKPXRouter.s.sol:DeployKPXRouter \
            --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.DEPLOYER_PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }} \
            -vvvv 2>&1 | tee deploy-output.txt

          ROUTER=$(grep -oP '(?<=KPXRouterGateway :\s)0x[0-9a-fA-F]{40}' deploy-output.txt || echo "")
          VRQ=$(grep -oP '(?<=VRQVerifier\s+:\s)0x[0-9a-fA-F]{40}' deploy-output.txt || echo "")
          echo "router_address=${ROUTER}" >> $GITHUB_OUTPUT
          echo "vrq_address=${VRQ}" >> $GITHUB_OUTPUT
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: "📤 Upload broadcast"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpx-broadcast-${{ github.event.inputs.environment || 'sepolia' }}-${{ github.sha }}
          path: broadcast/
          retention-days: 90

      - name: "📣 Deployment summary"
        if: success()
        run: |
          NETWORK="${{ github.event.inputs.environment || 'sepolia' }}"
          echo "## ✅ KPXRouterGateway Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Network | \`${NETWORK}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| KPXRouterGateway | \`${{ steps.deploy.outputs.router_address }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VRQVerifier | \`${{ steps.deploy.outputs.vrq_address }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Update Alto Bundler: set \`ROUTER_ADDRESS\` in vault-relayer .env" >> $GITHUB_STEP_SUMMARY
          echo "2. Replace MockVRQVerifier with production VRQ before mainnet" >> $GITHUB_STEP_SUMMARY
          echo "3. Replace MockDarkPool with production KPXDarkPool" >> $GITHUB_STEP_SUMMARY
          echo "4. Transfer ownership from deployer EOA to TreasuryDAO multisig" >> $GITHUB_STEP_SUMMARY
